<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodCompanion – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg: #0d0f1a;
      --surface: #13152a;
      --card: #1a1d35;
      --border: #2a2d4a;
      --accent: #7c6af7;
      --accent2: #f76ab7;
      --accent3: #6af7c8;
      --text: #e8eaf6;
      --muted: #8890b5;
      --error: #f77a6a;
      --success: #6af7a0;
      --radius: 18px;
      --shadow: 0 8px 40px rgba(124,106,247,0.18);
    }
    [data-theme="light"] {
      --bg: #f0f2ff;
      --surface: #e4e8ff;
      --card: #fff;
      --border: #c8cdee;
      --text: #1a1d35;
      --muted: #555a80;
      --shadow: 0 8px 40px rgba(124,106,247,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.4s, color 0.4s;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite;
    }
    .blob1 { width: 420px; height: 420px; background: var(--accent); top: -100px; left: -80px; animation-delay: 0s; }
    .blob2 { width: 320px; height: 320px; background: var(--accent2); bottom: -80px; right: -60px; animation-delay: 3s; }
    .blob3 { width: 250px; height: 250px; background: var(--accent3); top: 40%; left: 55%; animation-delay: 5s; }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.07); }
    }

    .theme-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 50px; padding: 8px 16px;
      cursor: pointer; font-size: 18px; transition: all 0.3s;
    }
    .theme-toggle:hover { transform: scale(1.1); }

    .auth-wrapper {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px; padding: 20px;
    }

    .logo-area {
      text-align: center; margin-bottom: 32px;
    }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 22px; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 14px;
      box-shadow: 0 8px 30px rgba(124,106,247,0.4);
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { box-shadow: 0 8px 30px rgba(124,106,247,0.4); }
      50% { box-shadow: 0 8px 50px rgba(247,106,183,0.5); }
    }
    .logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
background-clip: text;           /* ← add this line */
-webkit-text-fill-color: transparent;
    }
    .logo-tagline { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: var(--shadow);
      animation: cardIn 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Tab switcher */
    .tab-bar {
      display: flex; gap: 4px;
      background: var(--surface); border-radius: 12px; padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: transparent;
      color: var(--muted); border-radius: 9px; cursor: pointer;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 13px; color: var(--muted);
      margin-bottom: 7px; font-weight: 500; letter-spacing: 0.3px;
    }
    .form-input {
      width: 100%; padding: 13px 16px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: all 0.3s; outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,247,0.15);
    }
    .form-input::placeholder { color: var(--muted); opacity: 0.6; }

    .input-icon-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 16px; pointer-events: none;
    }
    .input-icon ~ .form-input { padding-left: 42px; }

    .submit-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 12px; color: #fff;
      font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.3s; margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,106,247,0.4); }
    .submit-btn:active { transform: translateY(0); }

    .divider {
      text-align: center; color: var(--muted); font-size: 12px;
      margin: 18px 0; position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 40%; height: 1px; background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .guest-btn {
      width: 100%; padding: 12px;
      background: transparent; border: 1.5px solid var(--border);
      border-radius: 12px; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      cursor: pointer; transition: all 0.3s;
    }
    .guest-btn:hover { border-color: var(--accent3); color: var(--accent3); }

    .alert {
      padding: 12px 16px; border-radius: 10px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .alert.error { background: rgba(247,122,106,0.15); color: var(--error); border: 1px solid rgba(247,122,106,0.3); display: block; }
    .alert.success { background: rgba(106,247,160,0.15); color: var(--success); border: 1px solid rgba(106,247,160,0.3); display: block; }

    .mood-chips {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .mood-chip {
      padding: 6px 12px; border-radius: 50px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .mood-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

    .terms { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
    .terms a { color: var(--accent); text-decoration: none; }

    /* Password strength */
    .strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; width: 0%; transition: all 0.3s; }

    @media (max-width: 480px) {
      .auth-card { padding: 26px 20px; }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- Background -->
  <div class="bg-blobs">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>

  <div class="auth-wrapper">
    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-icon">🧠</div>
      <div class="logo-name">MoodCompanion</div>
      <div class="logo-tagline">Your mental wellness companion for student life</div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Alert -->
      <div class="alert" id="alert-msg"></div>

      <!-- LOGIN PANEL -->
      <div class="tab-panel active" id="panel-login">
        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <div class="input-icon-wrap">
            <span class="input-icon">👤</span>
            <input type="text" class="form-input" id="login-user" placeholder="your@email.com" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input" id="login-pass" placeholder="••••••••" />
          </div>
        </div>
        <button class="submit-btn" onclick="handleLogin()">✨ Sign In</button>
        <div class="divider">or</div>
        <button class="guest-btn" onclick="guestLogin()">🚀 Continue as Guest</button>
        <p class="terms" style="margin-top:14px;">
          Don't have an account? <a href="#" onclick="switchTab('register')">Register free</a>
        </p>
      </div>

      <!-- REGISTER PANEL -->
      <div class="tab-panel" id="panel-register">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-icon-wrap">
            <span class="input-icon">✏️</span>
            <input type="text" class="form-input" id="reg-name" placeholder="Your full name" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <span class="input-icon">📧</span>
            <input type="email" class="form-input" id="reg-email" placeholder="student@college.edu" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input" id="reg-pass" placeholder="Min. 6 characters" oninput="checkStrength(this.value)" />
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        </div>
        <div class="form-group">
          <label class="form-label">How are you feeling today? 💭</label>
          <div class="mood-chips">
            <div class="mood-chip" onclick="selectMood(this,'😊 Happy')">😊 Happy</div>
            <div class="mood-chip" onclick="selectMood(this,'😰 Stressed')">😰 Stressed</div>
            <div class="mood-chip" onclick="selectMood(this,'😔 Sad')">😔 Sad</div>
            <div class="mood-chip" onclick="selectMood(this,'😤 Anxious')">😤 Anxious</div>
            <div class="mood-chip" onclick="selectMood(this,'😌 Calm')">😌 Calm</div>
            <div class="mood-chip" onclick="selectMood(this,'😴 Tired')">😴 Tired</div>
          </div>
        </div>
        <button class="submit-btn" onclick="handleRegister()">🎉 Create Account</button>
        <p class="terms">
          By registering you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a>
        </p>
      </div>
    </div>
  </div>

<script>
  // ===== THEME TOGGLE =====
  function toggleTheme() {
    const body = document.body;
    const btn = document.querySelector('.theme-toggle');
    if (body.dataset.theme === 'dark') {
      body.dataset.theme = 'light';
      btn.textContent = '🌞';
    } else {
      body.dataset.theme = 'dark';
      btn.textContent = '🌙';
    }
  }

  // ===== TAB SWITCH =====
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    hideAlert();
  }

  // ===== MOOD SELECTOR =====
  let selectedMood = '';
  function selectMood(el, mood) {
    document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedMood = mood;
  }

  // ===== PASSWORD STRENGTH =====
  function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#f77a6a','#f7b76a','#f7e06a','#6af7a0','#6af7c8'];
    fill.style.width = (score * 20) + '%';
    fill.style.background = colors[score - 1] || 'transparent';
  }

  // ===== ALERT HELPERS =====
  function showAlert(msg, type) {
    const el = document.getElementById('alert-msg');
    el.textContent = msg; el.className = 'alert ' + type;
  }
  function hideAlert() {
    document.getElementById('alert-msg').className = 'alert';
  }

  // ===== REGISTER =====
  function handleRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;

    if (!name || !email || !pass) return showAlert('⚠️ Please fill all fields.', 'error');
    if (pass.length < 6) return showAlert('⚠️ Password must be at least 6 characters.', 'error');
    if (!email.includes('@')) return showAlert('⚠️ Enter a valid email.', 'error');

    // Save user to localStorage
    const users = JSON.parse(localStorage.getItem('mc_users') || '[]');
    if (users.find(u => u.email === email)) return showAlert('⚠️ Email already registered!', 'error');

    const user = { name, email, pass, mood: selectedMood, joined: new Date().toLocaleDateString() };
    users.push(user);
    localStorage.setItem('mc_users', JSON.stringify(users));
    showAlert('✅ Account created! Signing you in...', 'success');
    setTimeout(() => loginUser(user), 1200);
  }

  // ===== LOGIN =====
  function handleLogin() {
    const input = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!input || !pass) return showAlert('⚠️ Please enter credentials.', 'error');

    const users = JSON.parse(localStorage.getItem('mc_users') || '[]');
    const user = users.find(u => (u.email === input || u.name === input) && u.pass === pass);
    if (!user) return showAlert('❌ Invalid credentials. Try again or register.', 'error');

    showAlert('✅ Welcome back, ' + user.name + '!', 'success');
    setTimeout(() => loginUser(user), 900);
  }

  // ===== GUEST LOGIN =====
  function guestLogin() {
    loginUser({ name: 'Guest User', email: 'guest', isGuest: true });
  }

  // ===== SET SESSION & REDIRECT =====
  function loginUser(user) {
    localStorage.setItem('mc_session', JSON.stringify(user));
    window.location.href = '/';
  }

  // ===== CHECK IF ALREADY LOGGED IN =====
if (localStorage.getItem('mc_session')) {
    window.location.href = '/';
}
</script>
</body>
</html>
